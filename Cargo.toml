# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]
# `cargo test` / `cargo clippy` sem `-p` não tocam em src-tauri (exige webkit2gtk).
default-members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
repository = "https://github.com/apuracao-rj/apuracao-rj"

[profile.release]
lto = true
codegen-units = 1
strip = true
