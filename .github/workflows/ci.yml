# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Instalar toolchain Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p apuracao-core --all-targets -- -D warnings
      - run: cargo test -p apuracao-core
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  front:
    name: Front (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx vitest run

  tauri-linux:
    name: Compilar app Tauri (Linux)
    runs-on: ubuntu-22.04
    needs: [rust, front]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Dependências do webkit2gtk-4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev build-essential curl wget file
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar toolchain Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ". -> target"
      - run: npm ci
      - run: npm run build
      - run: cargo build -p apuracao-rj --locked
